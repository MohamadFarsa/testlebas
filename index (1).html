<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ایران ویر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#0b0b0e;--card:#15151a;--line:#26262e;--gold:#e8b45a;--tx:#f4f1ea;--mut:#b9b2a3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.7 Vazirmatn,Tahoma,sans-serif}
main{max-width:480px;margin:0 auto;padding:0 16px 40px}
.hero{text-align:center;padding:36px 0 8px}.logo{width:88px;height:88px;margin:0 auto 10px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-weight:800;font-size:13px;letter-spacing:2px}
h1{margin:0;font-size:24px;font-weight:800}.mut{color:var(--mut);font-size:13px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--tx);text-decoration:none;font-size:12px}
.gold{display:flex;width:100%;min-height:48px;border:0;border-radius:12px;background:linear-gradient(135deg,#f0c36d,#d89a3c);color:#16110a;font:600 15px Vazirmatn;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
.box{margin:14px 0;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
h2{font-size:16px;margin:22px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;padding:7px 16px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:linear-gradient(135deg,#f0c36d,#d89a3c);color:#16110a;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.card{padding:8px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--tx);text-align:right;font:inherit;cursor:pointer}
.img{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;background:#222;display:grid;place-items:center;color:var(--gold);font-size:32px;font-weight:800}
.card b{display:block;margin:8px 0 2px;font-size:13px;font-weight:600}.price{color:var(--gold);font-size:13px}
dialog{width:min(92vw,440px);padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--tx)}
dialog::backdrop{background:#000a}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<dialog id="dlg"></dialog>
<script>
const KEY='iw_data';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('fa-IR')+' تومان';
async function load(){
  try{const l=localStorage.getItem(KEY);if(l)return JSON.parse(l)}catch(e){}
  const r=await fetch('data.json');return r.json();
}
let D,cat='all';
function img(p,cls){return p.image?`<img class="img" src="${esc(p.image)}" alt="${esc(p.name)}">`:`<div class="img" role="img" aria-label="${esc(p.name)}">${esc(p.name[0]||'')}</div>`}
function render(){
  const s=D.shop,list=D.products.filter(p=>p.published&&(cat==='all'||p.category===cat));
  const tel=String(s.phone||'').replace(/\D/g,'');
  document.title=s.name;
  app.innerHTML=`
  <div class="hero"><div class="logo">IRAN WEAR</div><h1>${esc(s.name)}</h1><div class="mut">${esc(s.desc)}</div><div class="mut">${esc(s.tagline)}</div></div>
  <div class="row">
    <a class="btn" href="tel:${esc(tel)}">تماس</a>
    <a class="btn" href="https://wa.me/${esc(s.whatsapp)}" target="_blank" rel="noopener">واتساپ</a>
    <a class="btn" href="https://t.me/${esc(s.telegram)}" target="_blank" rel="noopener">تلگرام</a>
    <a class="btn" href="https://instagram.com/${esc(s.instagram)}" target="_blank" rel="noopener">اینستاگرام</a>
  </div>
  <button class="gold" id="vc">ذخیره شماره در مخاطبین</button>
  <div class="box"><div>آدرس فروشگاه</div><div class="mut">${esc(s.address)}</div>${s.mapUrl?`<a href="${esc(s.mapUrl)}" target="_blank" rel="noopener" style="color:var(--gold)">مشاهده در نقشه</a>`:''}</div>
  <h2>دسته‌بندی‌ها</h2>
  <div class="chips"><button class="chip ${cat==='all'?'on':''}" data-c="all">همه</button>${D.categories.map(c=>`<button class="chip ${cat===c.id?'on':''}" data-c="${esc(c.id)}">${esc(c.name)}</button>`).join('')}</div>
  <div class="grid">${list.map(p=>`<button class="card" data-p="${esc(p.id)}">${img(p)}<b>${esc(p.name)}</b><span class="price">${money(p.price)}</span></button>`).join('')||'<p class="mut">محصولی در این دسته نیست.</p>'}</div>`;
  vc.onclick=()=>{
    const v=`BEGIN:VCARD\nVERSION:3.0\nFN:${s.name}\nTEL:${s.phone}\nADR:;;${s.address};;;;\nEND:VCARD`;
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([v],{type:'text/vcard'}));a.download='contact.vcf';a.click();
  };
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;render()});
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>open(b.dataset.p));
}
function open(id){
  const p=D.products.find(x=>x.id===id),s=D.shop;
  dlg.innerHTML=`${img(p)}<h2>${esc(p.name)}</h2><div class="price">${money(p.price)}</div><p class="mut">${esc(p.desc)}</p>
  <a class="gold" target="_blank" rel="noopener" href="https://wa.me/${esc(s.whatsapp)}?text=${encodeURIComponent('سلام، درباره '+p.name+' سوال دارم')}">سفارش در واتساپ</a>
  <button class="chip" style="margin-top:10px;width:100%" onclick="dlg.close()">بستن</button>`;
  dlg.showModal();
}
load().then(d=>{D=d;render()}).catch(()=>{app.innerHTML='<p class="box">data.json پیدا نشد. فایل‌ها را با یک وب‌سرور باز کنید.</p>'});
</script>
</body>
</html>
