<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت ایران ویر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#0b0b0e;--card:#15151a;--line:#26262e;--gold:#e8b45a;--tx:#f4f1ea;--mut:#b9b2a3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.7 Vazirmatn,Tahoma,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0;font-weight:800}
nav{display:flex;gap:8px;margin-bottom:14px}
button,.b{min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.on,.gold{background:linear-gradient(135deg,#f0c36d,#d89a3c);color:#16110a;border-color:transparent;font-weight:600}
.panel{padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
input,select,textarea{width:100%;min-height:42px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#0f0f13;color:var(--tx);font:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:400}
.th{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#222;display:block}
.ok{color:#3fb56b}.off{color:var(--mut)}.del{color:#e5675f}
dialog{width:min(94vw,480px);padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--tx)}
dialog::backdrop{background:#000a}
#toast{position:fixed;bottom:16px;inset-inline:0;margin:auto;width:max-content;padding:8px 18px;border-radius:10px;background:#3fb56b;color:#04140a;display:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold)}
@media(max-width:560px){.g2{grid-template-columns:1fr}.hide{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>پنل مدیریت</h1><div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="gold" id="save">ذخیره تغییرات</button><button id="exp">دانلود data.json</button>
<button id="imp">بارگذاری json</button><button id="rst">بازگشت به data.json</button><input type="file" id="file" accept=".json" hidden></div></header>
<nav><button data-t="shop" class="on">اطلاعات فروشگاه</button><button data-t="prod">محصولات</button><button data-t="cats">دسته‌بندی‌ها</button></nav>
<section class="panel" id="view"></section>
</div>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script>
const KEY='iw_data';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
let D,tab='shop';
async function fromFile(){const r=await fetch('data.json');return r.json()}
async function load(){try{const l=localStorage.getItem(KEY);if(l)return JSON.parse(l)}catch(e){}return fromFile()}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function persist(){localStorage.setItem(KEY,JSON.stringify(D));toast('ذخیره شد')}
const fields=[['name','نام فروشگاه'],['desc','توضیح کوتاه'],['tagline','شعار'],['phone','شماره تماس'],['whatsapp','واتساپ (مثلاً 989120000000)'],['telegram','آیدی تلگرام'],['instagram','آیدی اینستاگرام'],['address','آدرس'],['mapUrl','لینک نقشه']];
function view(){
  const v=$('#view');
  if(tab==='shop'){
    v.innerHTML='<div class="g2">'+fields.map(([k,l])=>`<div><label for="f_${k}">${l}</label><input id="f_${k}" value="${esc(D.shop[k])}"></div>`).join('')+'</div>';
    fields.forEach(([k])=>$('#f_'+k).oninput=e=>D.shop[k]=e.target.value);
  }else if(tab==='prod'){
    const cn=id=>(D.categories.find(c=>c.id===id)||{}).name||'-';
    v.innerHTML=`<button class="gold" id="add">+ افزودن محصول</button><div style="overflow-x:auto;margin-top:12px"><table><tr><th>تصویر</th><th>نام</th><th class="hide">دسته</th><th>قیمت</th><th>وضعیت</th><th>عملیات</th></tr>`+
    D.products.map(p=>`<tr><td>${p.image?`<img class="th" src="${esc(p.image)}" alt="">`:'<i class="th"></i>'}</td><td>${esc(p.name)}</td><td class="hide">${esc(cn(p.category))}</td><td>${Number(p.price).toLocaleString('fa-IR')}</td><td class="${p.published?'ok':'off'}">${p.published?'منتشر شده':'پیش‌نویس'}</td><td><button data-e="${esc(p.id)}">ویرایش</button> <button class="del" data-d="${esc(p.id)}">حذف</button></td></tr>`).join('')+'</table></div>';
    $('#add').onclick=()=>edit();
    v.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>edit(b.dataset.e));
    v.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('این محصول حذف شود؟')){D.products=D.products.filter(p=>p.id!==b.dataset.d);view()}});
  }else{
    v.innerHTML=D.categories.map((c,i)=>`<div style="display:flex;gap:8px;margin-bottom:8px"><input data-i="${i}" value="${esc(c.name)}" aria-label="نام دسته"><button class="del" data-x="${i}">حذف</button></div>`).join('')+'<button class="gold" id="ac">+ دسته جدید</button>';
    v.querySelectorAll('[data-i]').forEach(i=>i.oninput=e=>D.categories[i.dataset.i].name=e.target.value);
    v.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{D.categories.splice(b.dataset.x,1);view()});
    $('#ac').onclick=()=>{D.categories.push({id:'c'+Date.now(),name:'دسته جدید'});view()};
  }
}
function edit(id){
  const p=D.products.find(x=>x.id===id)||{id:'p'+Date.now(),name:'',price:0,category:(D.categories[0]||{}).id,desc:'',image:'',published:true,_new:true};
  const d=$('#dlg');
  d.innerHTML=`<h2 style="margin-top:0">${p._new?'افزودن':'ویرایش'} محصول</h2>
  <label for="n">نام محصول</label><input id="n" value="${esc(p.name)}">
  <div class="g2"><div><label for="pr">قیمت (تومان)</label><input id="pr" type="number" min="0" value="${esc(p.price)}"></div>
  <div><label for="ct">دسته‌بندی</label><select id="ct">${D.categories.map(c=>`<option value="${esc(c.id)}" ${c.id===p.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>
  <label for="ds">توضیحات</label><textarea id="ds" rows="3">${esc(p.desc)}</textarea>
  <label for="im">آدرس تصویر یا آپلود</label><input id="im" value="${p.image&&p.image.startsWith('data:')?'':esc(p.image)}" placeholder="https://..."><input id="up" type="file" accept="image/*" style="margin-top:6px">
  <label><input id="pb" type="checkbox" style="width:auto;min-height:0" ${p.published?'checked':''}> منتشر شده</label>
  <div style="display:flex;gap:8px;margin-top:14px"><button class="gold" id="ok" style="flex:1">ذخیره محصول</button><button id="no">انصراف</button></div>`;
  let img=p.image;
  $('#up').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{img=r.result;toast('تصویر آماده شد')};r.readAsDataURL(f)};
  $('#no').onclick=()=>d.close();
  $('#ok').onclick=()=>{
    if(!$('#n').value.trim())return toast('نام محصول لازم است');
    const o={id:p.id,name:$('#n').value.trim(),price:Number($('#pr').value)||0,category:$('#ct').value,desc:$('#ds').value,image:$('#im').value||img||'',published:$('#pb').checked};
    const i=D.products.findIndex(x=>x.id===p.id);i<0?D.products.push(o):D.products[i]=o;
    d.close();view();
  };
  d.showModal();
}
document.querySelectorAll('nav [data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));view()});
$('#save').onclick=persist;
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='data.json';a.click()};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{D=JSON.parse(t);view();toast('بارگذاری شد؛ ذخیره را بزنید')}catch(x){toast('فایل json معتبر نیست')}})};
$('#rst').onclick=async()=>{if(confirm('تغییرات ذخیره‌شده پاک و data.json دوباره خوانده شود؟')){localStorage.removeItem(KEY);D=await fromFile();view()}};
load().then(d=>{D=d;view()}).catch(()=>{$('#view').textContent='data.json پیدا نشد. فایل‌ها را با یک وب‌سرور باز کنید.'});
</script>
</body>
</html>
